services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: geotect
      POSTGRES_PASSWORD: geotect
      POSTGRES_DB: geotect
    ports: ["5432:5432"]
    volumes:
      - geotect-db:/home/postgres/pgdata/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U geotect -d geotect"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://geotect:geotect@db:5432/geotect
      GEOTECT_SUPER_ADMIN_EMAIL: chrisndirangu54@gmail.com
      GEOTECT_MASTER_KEY: ${GEOTECT_MASTER_KEY:?set GEOTECT_MASTER_KEY}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    depends_on: [api]

  telemetry:
    profiles: ["telemetry"]
    build:
      context: .
      dockerfile: services/Dockerfile.telemetry
    environment:
      MQTT_BROKER: host.docker.internal
      MQTT_PORT: 1883
      MQTT_TOPIC: geotect/#
      GEOTECT_API: http://api:8000
    depends_on: [api]

  industrial:
    profiles: ["industrial"]
    build:
      context: .
      dockerfile: services/Dockerfile.telemetry
    command: ["python","industrial_worker.py"]
    environment:
      GEOTECT_API: http://api:8000
      INDUSTRIAL_PROTOCOL: modbus
      POLL_INTERVAL_SECONDS: 10
    depends_on: [api]

volumes:
  geotect-db:
