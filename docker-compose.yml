services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: geotect
      POSTGRES_PASSWORD: geotect
      POSTGRES_DB: geotect
    ports: ["5432:5432"]
    volumes:
      - geotect-db:/home/postgres/pgdata/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U geotect -d geotect"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://geotect:geotect@db:5432/geotect
      GEOTECT_SUPER_ADMIN_EMAIL: chrisndirangu54@gmail.com
      GEOTECT_MASTER_KEY: ${GEOTECT_MASTER_KEY:?set GEOTECT_MASTER_KEY}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      GEOTECT_OBJECT_BUCKET: geotect
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-geotect}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-geotect-change-me}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  web:
    build: ./apps/web
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    depends_on: [api]

  telemetry:
    profiles: ["telemetry"]
    build:
      context: .
      dockerfile: services/Dockerfile.telemetry
    environment:
      MQTT_BROKER: host.docker.internal
      MQTT_PORT: 1883
      MQTT_TOPIC: geotect/#
      GEOTECT_API: http://api:8000
    depends_on: [api]

  industrial:
    profiles: ["industrial"]
    build:
      context: .
      dockerfile: services/Dockerfile.telemetry
    command: ["python","industrial_worker.py"]
    environment:
      GEOTECT_API: http://api:8000
      INDUSTRIAL_PROTOCOL: modbus
      POLL_INTERVAL_SECONDS: 10
    depends_on: [api]

  compute:
    profiles: ["compute"]
    build:
      context: .
      dockerfile: services/Dockerfile.compute
    environment:
      DATABASE_URL: postgresql+asyncpg://geotect:geotect@db:5432/geotect
    depends_on:
      db:
        condition: service_healthy

  edge:
    profiles: ["edge"]
    image: python:3.12-slim
    working_dir: /edge
    command: ["python","edge_gateway.py"]
    volumes:
      - ./services/edge_gateway.py:/edge/edge_gateway.py:ro
      - geotect-edge:/edge/data
    environment:
      EDGE_DB: /edge/data/geotect-edge.db
      GEOTECT_EDGE_FORWARD_URL: ${GEOTECT_EDGE_FORWARD_URL:-}
      EDGE_RULES: ${EDGE_RULES:-[]}

  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    ports: ["6379:6379"]
    volumes:
      - geotect-redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-geotect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-geotect-change-me}
    ports: ["9000:9000","9001:9001"]
    volumes:
      - geotect-objects:/data

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-geotect} ${MINIO_ROOT_PASSWORD:-geotect-change-me}; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/geotect;
      /usr/bin/mc anonymous set none local/geotect;
      exit 0;
      "

volumes:
  geotect-db:
  geotect-edge:
  geotect-redis:
  geotect-objects:
